services:
  traefik:
    # >= 3.6.1 requis pour négocier l'API Docker ; Engine 29 refuse l'API 1.24.
    image: traefik:v3.7.16
    container_name: traefik
    restart: always
    networks:
      - proxy
    ports:
      - 80:80
      - 443:443
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/apps/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /opt/apps/traefik/acme.json:/acme.json
    labels:
      - traefik.enable=false

networks:
  proxy:
    external: true
