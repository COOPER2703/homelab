; Configuration CouchDB pour Obsidian LiveSync.
; Copiée dans /opt/apps/obsidian/etc, monté sur /opt/couchdb/etc/local.d.

[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

; Duplicata volontaire : LiveSync vérifie chttpd_auth, CouchDB applique chttpd.
[chttpd_auth]
require_valid_user = true

[chttpd_auth_lockout]
mode = warn

; Duplicata volontaire : enable_cors est appliqué par chttpd depuis CouchDB 3.2,
; certaines versions de LiveSync vérifient encore httpd.
[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
