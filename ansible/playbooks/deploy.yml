- name: Deploy Docker apps
  hosts: servers
  become: true

  vars:
    apps_path: /opt/apps
    templates_path: "{{ [playbook_dir, '..', 'templates'] | path_join | realpath }}"

  tasks:
    - name: Check if Docker network proxy exists
      ansible.builtin.command:
        cmd: docker network inspect proxy
      register: docker_network_check
      changed_when: false
      failed_when: false

    - name: Create Docker network proxy
      ansible.builtin.command:
        cmd: docker network create --driver bridge proxy
      when: docker_network_check.rc != 0

    - name: Discover app templates
      ansible.builtin.find:
        paths: "{{ templates_path }}"
        file_type: directory
        patterns: "*"
        recurse: false
      register: app_dirs
      delegate_to: localhost
      run_once: true
      become: false

    - name: Deploy apps
      ansible.builtin.include_tasks: "{{ item }}/deploy.yml"
      loop: "{{ app_dirs.files | map(attribute='path') | sort }}"
      loop_control:
        label: "{{ item | basename }}"
